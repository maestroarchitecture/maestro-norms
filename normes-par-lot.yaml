      lots_concernes: ["tous"]
      justification: "Base légale du taux 10 % appliqué à tout devis Maestro (logement > 2 ans) + attestation signée avant facturation — référence fiscale qui vit dans le contrat interne tva.md, hors registre dtu_rules. Cas particulier TVA mixte (mobilier/électroménager 20 %) : voir lot 11."

