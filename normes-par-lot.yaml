# normes-par-lot.yaml — SOCLE NORMATIF PAR LOT : catalogue canonique machine
# ---------------------------------------------------------------------------
# Consolidation des 4 recensements de groupe du 2026-07-09 :
#   chantier-gros-oeuvre (lots 00, 01, 12), second-oeuvre-sec (lots 02, 06, 07),
#   lots-techniques (lots 03, 04, 05), finitions (lots 08, 09, 10, 11).
# Chaque entrée = MÉTADONNÉES publiques d'un texte (ref, titre, édition, statut,
# source publique). AUCUN contenu de texte licencié (Reef/AFNOR/CSTB payant)
# n'est recopié ici. Les seuils chiffrés vivent dans dtu_rules.yaml (registre),
# après lecture de la source primaire.
#
# RÈGLE DE CONSOMMATION : tout agent/outil qui charge le bloc d'un lot DOIT
# charger AUSSI le bloc `transverse` (textes qui touchent tous les lots).
# Un texte multi-lots non universel (ex. arrêté du 24 mars 1982) est répété
# dans chaque lot concerné, avec la MÊME graphie de ref partout.

meta:
  generated: "2026-07-09"
  revise: >-
    2026-07-26 — passe de correction de fond. (1) Travail en hauteur : l'entrée unique
    « R4323-58 » est éclatée en trois entrées correspondant au contenu réel des articles
    R4323-58, R4323-59 et R4323-60, lus sur Legifrance ce jour ; la formule « protection
    collective obligatoire au-delà de 3 m » est déclarée FAUSSE et la consigne de
    « régularisation » est remplacée par une consigne de correction. L'arrêté du 21 décembre
    2004 (vérifications d'échafaudage) et la recommandation R408 sont répétés au bloc
    transverse. (2) Lot 12 : note d'état ajoutée, le lot est ACTIF et n'est plus décrit comme
    à ouvrir. (3) NF DTU 52.10 : indice de classement vérifié et inscrit. (4) NF DTU 53.1 et
    53.2 : statut d'annulation durci et actions de correction mises à jour.
  methode: >-
    Gisements internes lus d'abord (lot-norms-mapping.yaml du 04/06, dtu_rules.yaml,
    check_dtu_refs.py, KB normes-dtu.md par lot, ffb-techniques-index.yaml,
    _seuils-reglementaires.md), puis vérification publique de CHAQUE référence
    retenue (boutiques CSTB/AFNOR, Norm'Info, liste CSTB des DTU en vigueur au
    9 juillet 2025, Legifrance, BOFiP, ffbatiment.fr, Cegibat-GRDF, ccfat.fr,
    programmepacte.fr, ameli.fr). Consolidation multi-groupes avec déduplication
    des graphies de ref et extraction des textes universels vers le bloc transverse.
  licence: >-
    Métadonnées publiques seulement ; textes intégraux = Reef (licence Namur),
    citation seule. Les documents gratuits en plein texte (Legifrance, RAGE/PACTE/
    PROFEEL, e-Cahiers CSTB publics, règles professionnelles FFB) sont téléchargeables ;
    les DTU/NF/normes AFNOR restent en citation seule (droit d'auteur).
  statuts:
    statut: "en_vigueur = texte applicable à la date de génération (les textes annulés/abrogés/remplacés sont dans refs_perimees, jamais dans les blocs lots)."
    statut_verif: "confirme_public = édition et vigueur recoupées sur au moins une source publique citée ; edition_a_confirmer = texte identifié mais édition exacte non recoupée cette session."
    deja_au_registre: "true = le texte a déjà au moins une RÈGLE CHIFFRÉE au registre des seuils et/ou figure dans l'allowlist de contrôle ; false = pas de règle chiffrée et hors allowlist (NE PAS citer en description client avant inscription). Les références candidates du lot 12 restent dans ce catalogue : aucune entrée à vérifier ne vit dans dtu_rules.yaml, dont le lecteur ne filtre pas le statut."
    priorite_reef: "haute/moyenne = texte PAYANT dont des seuils chiffrés utiles au chiffrage restent à extraire via le protocole registre (source primaire lue -> statut verifie -> allowlist) ; basse = texte gratuit en plein texte, ou citation d'appui sans seuil propre, ou seuils déjà extraits."
  registre: "dtu_rules.yaml (racine maestro-norms) — seul endroit où vivent les seuils chiffrés."
  garde_fou_ci: "check_dtu_refs.py ne détecte que les tokens NF DTU / NF EN / NF C 15-100 / arrêté : les e-Cahiers CSTB et articles de codes cités en description client ne seraient PAS contrôlés."

lots:

  "00":
    label: "Installation de chantier - Nettoyage"
    entrees:
