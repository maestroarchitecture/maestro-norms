        titre: "Arrêté relatif aux vérifications des échafaudages et modifiant l'annexe de l'arrêté du 22 décembre 2000"
        edition: "21 décembre 2004, version consolidée en vigueur"
        statut: en_vigueur
        statut_verif: confirme_public
        source_publique: "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000240930"
        deja_au_registre: false
        priorite_reef: basse
        justification: "Impose examen journalier + vérification trimestrielle + vérification à chaque (re)mise en service de l'échafaudage — cadence et justifie le coût d'un poste échafaudage de longue durée."
      - ref: "Recommandation R408 (CNAMTS)"
        titre: "Montage, utilisation et démontage des échafaudages de pied"
        edition: "Adoptée le 10 juin 2004 (annule et remplace la R279)"
        statut: en_vigueur
        statut_verif: confirme_public
        source_publique: "https://www.ameli.fr/sites/default/files/Documents/5338/document/recommandation-r408_assurance-maladie.pdf"
        deja_au_registre: false
        priorite_reef: basse
        justification: "Exigence de compétence/formation des monteurs opposable via CARSAT — justifie la sous-traitance du montage d'échafaudage à une entreprise formée R408 (le corpus FFB lot 00 est entièrement consacré aux échafaudages)."
      - ref: "NF EN 12811-1"
        titre: "Équipements temporaires de chantiers — Partie 1 : échafaudages — Exigences de performance et étude, en général"
        edition: "Août 2004"
        statut: en_vigueur
        statut_verif: confirme_public
