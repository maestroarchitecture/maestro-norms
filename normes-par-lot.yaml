      justification: "Norme méthodologique du RAT (présomption de conformité à l'arrêté, sauf art. 4, 7, 11 et 14) — à citer en appui du préalable amiante ; le repérage lui-même est sous-traité à l'opérateur certifié, pas de seuil de chiffrage à extraire."
    - ref: "Code du travail, art. R4323-58"
      titre: "Travaux temporaires en hauteur réalisés à partir d'un plan de travail — obligation générale de conception, d'installation et d'équipement préservant la santé et la sécurité, dans des conditions ergonomiques"
      edition: "En vigueur depuis le 1er mai 2008 (décret n° 2008-244 du 7 mars 2008)"
      statut: en_vigueur
      statut_verif: confirme_public
      source_publique: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000018531397"
      deja_au_registre: false
      priorite_reef: basse
      lots_concernes: ["00", "10"]
      contenu_reel: "FAIT VÉRIFIÉ (source primaire lue sur Legifrance le 2026-07-26) : l'article impose que les travaux temporaires en hauteur soient réalisés à partir d'un plan de travail conçu, installé ou équipé de manière à préserver la santé et la sécurité des travailleurs, le poste permettant l'exécution dans des conditions ergonomiques. Il NE FIXE AUCUN SEUIL DE HAUTEUR."
      justification: "CORRECTION DU 2026-07-26 (remplace la consigne de « régularisation » précédente). La mention « protection collective obligatoire au-delà de 3 m », citée au poste échafaudage d'un devis de ravalement réel, N'EST PAS FONDÉE sur cet article : elle lui prête un seuil qu'il ne contient pas. Il n'y a donc rien à régulariser, il y a une citation FAUSSE à CORRIGER partout où elle apparaît, avant toute réutilisation client. La règle exacte se lit sur trois articles distincts — voir les deux entrées suivantes (R4323-59 et R4323-60). Texte gratuit sur Legifrance ; vaut pour tout travail en hauteur, quel que soit le lot."
    - ref: "Code du travail, art. R4323-59"
      titre: "Prévention des chutes de hauteur depuis un plan de travail — garde-corps ou tout autre moyen d'une sécurité équivalente"
      edition: "En vigueur depuis le 1er mai 2008 (décret n° 2008-244 du 7 mars 2008)"
      statut: en_vigueur
      statut_verif: confirme_public
      source_publique: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000018531395"
      deja_au_registre: false
      priorite_reef: basse
      lots_concernes: ["00", "10"]
      contenu_reel: "FAIT VÉRIFIÉ (source primaire lue sur Legifrance le 2026-07-26) : la prévention des chutes depuis un plan de travail est assurée par des garde-corps intégrés ou fixés de manière sûre, rigides et de résistance appropriée, placés à une hauteur comprise entre 1 m et 1,10 m, comportant une plinthe de butée de 10 à 15 cm selon la hauteur retenue, une main courante et une lisse intermédiaire à mi-hauteur — ou par tout autre moyen assurant une sécurité équivalente. Cet article ne fixe pas non plus de hauteur de chantier à partir de laquelle il s'appliquerait."
      justification: "C'est ICI que vit l'exigence de protection collective (garde-corps), et elle est PREMIÈRE : c'est la solution de référence, sans condition de hauteur minimale de travail. Le remplacement par un autre dispositif n'est admis que s'il assure une sécurité équivalente. À citer à la place de la formule fausse « protection collective obligatoire au-delà de 3 m »."
    - ref: "Code du travail, art. R4323-60"
      titre: "Impossibilité du garde-corps — dispositifs de recueil souples limitant la hauteur de chute"
      edition: "En vigueur depuis le 1er mai 2008 (décret n° 2008-244 du 7 mars 2008)"
      statut: en_vigueur
      statut_verif: confirme_public
      source_publique: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000018531393"
      deja_au_registre: false
      priorite_reef: basse
      lots_concernes: ["00", "10"]
      contenu_reel: "FAIT VÉRIFIÉ (source primaire lue sur Legifrance le 2026-07-26) : lorsque les dispositions de l'article R4323-59 ne peuvent pas être mises en œuvre, des dispositifs de recueil souples sont installés et positionnés de manière à éviter une chute de plus de trois mètres."
      justification: "SEULE origine réelle du « 3 m » dans ce corpus : ce n'est PAS une hauteur à partir de laquelle une protection deviendrait obligatoire, c'est la hauteur de chute MAXIMALE à ne pas dépasser quand on se rabat sur un filet ou un autre dispositif de recueil souple, faute de pouvoir installer un garde-corps. Attribuer ce seuil à l'article R4323-58, ou en faire un déclencheur d'obligation, est une erreur — à ne jamais réintroduire en description de poste ni en argumentaire client."
    - ref: "Arrêté du 21 décembre 2004"
      titre: "Arrêté relatif aux vérifications des échafaudages et modifiant l'annexe de l'arrêté du 22 décembre 2000"
      edition: "21 décembre 2004, version consolidée en vigueur"
      statut: en_vigueur
      statut_verif: confirme_public
      source_publique: "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000240930"
      deja_au_registre: false
      priorite_reef: basse
      lots_concernes: ["00", "10"]
      justification: "Répété ici depuis le bloc lot 00 (même graphie de ref) parce qu'il complète le socle « travail en hauteur » : il cadence les vérifications d'échafaudage (examen d'adéquation, examen de montage et d'installation, vérification de l'état de conservation) et justifie le coût d'un poste échafaudage de longue durée. Texte gratuit sur Legifrance. SOURCE SECONDAIRE à ce stade pour le détail des cadences : le contenu chiffré n'a pas été relu article par article — ne pas énoncer de périodicité chiffrée sans lecture."
    - ref: "Recommandation R408 (CNAMTS)"
      titre: "Montage, utilisation et démontage des échafaudages de pied"
      edition: "Adoptée le 10 juin 2004 (annule et remplace la R279)"
      statut: en_vigueur
      statut_verif: confirme_public
      source_publique: "https://www.ameli.fr/sites/default/files/Documents/5338/document/recommandation-r408_assurance-maladie.pdf"
      deja_au_registre: false
      priorite_reef: basse
      lots_concernes: ["00", "10"]
      justification: "Répétée ici depuis le bloc lot 00 (même graphie de ref) : exigence de compétence et de formation des monteurs, opposable via les CARSAT — c'est ce qui justifie de sous-traiter le montage d'échafaudage à une entreprise formée. Ce n'est PAS un texte réglementaire au sens strict : c'est une recommandation d'organisme de sécurité sociale, à présenter comme telle et non comme une obligation du Code du travail. PDF public gratuit."
    - ref: "Article 279-0 bis du CGI"
      titre: "TVA à taux réduit 10 % sur les travaux d'amélioration, transformation, aménagement et entretien des locaux d'habitation achevés depuis plus de 2 ans"
