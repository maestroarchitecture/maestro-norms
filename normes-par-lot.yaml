      justification: "Modalités opérationnelles du RAT dans les immeubles bâtis (opérateur certifié, rapport, conclusion présence/absence) — c'est lui qui exige l'« opérateur certifié » mentionné dans les conditions techniques des devis réels. Impact direct lot 09 : dépose de sols anciens (dalles vinyle-amiante, colles noires, ragréages) dans les logements d'avant 1997."
